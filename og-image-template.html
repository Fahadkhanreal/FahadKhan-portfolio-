<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>OG Image - Fahad Khan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Background decoration */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            background: #64ffda;
            top: -100px;
            right: -100px;
            filter: blur(80px);
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            background: #10b981;
            bottom: -80px;
            left: -80px;
            filter: blur(60px);
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 60px;
        }

        .greeting {
            color: #64ffda;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        .name {
            color: #f4f4f5;
            font-size: 80px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .title {
            color: #a1a1aa;
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .description {
            color: #71717a;
            font-size: 24px;
            max-width: 900px;
            margin: 0 auto 40px;
            line-height: 1.5;
        }

        .tech-stack {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tech-badge {
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: #64ffda;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 500;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: #52525b;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="container">
        <div class="greeting">Hi, I'm</div>
        <h1 class="name">Fahad Khan</h1>
        <h2 class="title">Full-Stack Developer & AI Enthusiast</h2>
        <p class="description">
            Building fast, scalable, and modern web applications with exceptional user experiences
        </p>
        <div class="tech-stack">
            <span class="tech-badge">Next.js</span>
            <span class="tech-badge">React</span>
            <span class="tech-badge">TypeScript</span>
            <span class="tech-badge">Node.js</span>
            <span class="tech-badge">PostgreSQL</span>
        </div>
    </div>

    <div class="footer">
        fahadkhan.dev • Full-Stack Portfolio
    </div>
</body>
</html>
